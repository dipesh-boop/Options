<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fidelity Human-Execution Dashboard</title>
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<header class="topbar">
  <h1>Fidelity Human-Execution Dashboard</h1>
  <div class="topbar-right">
    <span id="clock"></span>
    <button id="refresh-all-btn" class="btn btn-secondary">Reload</button>
  </div>
</header>

<main>
  <!-- ================= DATA PROVIDER HEALTH ================= -->
  <section id="data-provider-health" class="panel">
    <h2>Market Data <span id="data-provider-badge" class="badge">—</span></h2>
    <div class="stat-grid" id="data-provider-grid"></div>
  </section>

  <!-- ================= PORTFOLIO HEADER ================= -->
  <section id="portfolio-header" class="panel">
    <h2>Portfolio</h2>
    <div class="stat-grid" id="portfolio-header-grid"></div>
  </section>

  <!-- ================= RISK PANEL ================= -->
  <section id="risk-panel" class="panel">
    <h2>Risk <span id="risk-state-badge" class="badge">—</span></h2>
    <div id="risk-state-reason" class="muted"></div>
    <div class="stat-grid" id="risk-panel-grid"></div>
    <div class="risk-columns">
      <div>
        <h3>Underlying concentration</h3>
        <ul id="underlying-concentration" class="bar-list"></ul>
      </div>
      <div>
        <h3>Sector concentration</h3>
        <ul id="sector-concentration" class="bar-list"></ul>
      </div>
      <div>
        <h3>Correlation clusters</h3>
        <ul id="correlation-clusters" class="bar-list"></ul>
      </div>
    </div>
  </section>

  <!-- ================= WHEELS (RESEARCH / PAPER, read-only) ================= -->
  <section id="wheels-section" class="panel">
    <h2>Wheels <span class="muted">RESEARCH / PAPER &mdash; read only, no execution here</span></h2>
    <div id="wheels-list"></div>
  </section>

  <!-- ================= TODAY'S OPPORTUNITIES ================= -->
  <section id="opportunities" class="panel">
    <h2>Today's Opportunities</h2>
    <div id="opportunities-list"></div>
  </section>

  <!-- ================= AUDIT LOG ================= -->
  <section id="audit" class="panel">
    <h2>Audit Log</h2>
    <table id="audit-table">
      <thead><tr><th>Time</th><th>Trade</th><th>Event</th><th>Actor</th><th>Detail</th></tr></thead>
      <tbody id="audit-tbody"></tbody>
    </table>
  </section>
</main>

<!-- ================= MODALS ================= -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div id="modal" class="modal"></div>
</div>

<script src="/static/dashboard.js"></script>
</body>
</html>
