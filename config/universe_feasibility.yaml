# PAPER_TRADING_V1.5.14: the READ-ONLY universe-feasibility-study
# research universe -- loaded ONLY by `scripts/run_validation_cycle.py
# --universe-feasibility` (src.data.universe.load_universe/
# load_universe_strategies, pointed at THIS file's path explicitly).
#
# This file is completely separate from `config/universe.yaml`, the
# OFFICIAL active validation universe (SPY, QQQ) that
# `scripts/run_validation_cycle.py`'s default, state-mutating path
# reads. Nothing in this repository ever copies, merges, or falls back
# between the two files -- `--universe-feasibility` cannot activate any
# of these tickers for the official cycle, and the official cycle never
# reads this file. Expanding the OFFICIAL universe remains a separate,
# explicit, human-approved step (see UNIVERSE_EXPANSION_ACTIVATION_PLAN.md).
#
# `strategies` intentionally mirrors config/universe.yaml's own current
# list exactly -- PAPER_TRADING_V1.5.14 tests UNIVERSE BREADTH only, one
# variable at a time, never universe + strategy breadth together. Even
# if a future edit to this file listed a strategy beyond these three,
# `src.workflows.candidate_generation.candidate_eligible_strategies`
# (the same filter the official cycle and the V1.5.13 diagnostic both
# already apply) would silently narrow it back to only the strategies
# that actually have candidate-generation logic implemented today --
# this is a structural backstop, not merely a convention documented
# here.

tickers:
  - ticker: SPY
    sector: ETF
  - ticker: QQQ
    sector: ETF
  - ticker: IWM
    sector: ETF
  - ticker: DIA
    sector: ETF
  - ticker: AAPL
    sector: Technology
  - ticker: MSFT
    sector: Technology
  - ticker: NVDA
    sector: Technology
  - ticker: AMZN
    sector: Consumer Discretionary
  - ticker: META
    sector: Technology
  - ticker: GOOGL
    sector: Technology
  - ticker: JPM
    sector: Financials
  - ticker: XOM
    sector: Energy

strategies:
  - CASH_SECURED_PUT
  - COVERED_CALL
  - PUT_CREDIT_SPREAD
strategies_env: OPTIONS_AGENT_UNIVERSE_FEASIBILITY_STRATEGIES
