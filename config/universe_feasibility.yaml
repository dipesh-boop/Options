# PAPER_TRADING_V1.5.14: the READ-ONLY universe-feasibility-study
# research universe -- loaded ONLY by `scripts/run_validation_cycle.py
# --universe-feasibility` (src.data.universe.load_universe/
# load_universe_strategies, pointed at THIS file's path explicitly).
#
# This file is completely separate from `config/universe.yaml`, the
# OFFICIAL active validation universe (SPY, QQQ) that
# `scripts/run_validation_cycle.py`'s default, state-mutating path
# reads. Nothing in this repository ever copies, merges, or falls back
# between the two files -- `--universe-feasibility` cannot activate any
# of these tickers for the official cycle, and the official cycle never
# reads this file. Expanding the OFFICIAL universe remains a separate,
# explicit, human-approved step (see UNIVERSE_EXPANSION_ACTIVATION_PLAN.md).
#
# `strategies` intentionally mirrors config/universe.yaml's own current
# list exactly -- PAPER_TRADING_V1.5.14 tests UNIVERSE BREADTH only, one
# variable at a time, never universe + strategy breadth together. Even
# if a future edit to this file listed a strategy beyond these three,
# `src.workflows.candidate_generation.candidate_eligible_strategies`
# (the same filter the official cycle and the V1.5.13 diagnostic both
# already apply) would silently narrow it back to only the strategies
# that actually have candidate-generation logic implemented today --
# this is a structural backstop, not merely a convention documented
# here.

tickers:
  - ticker: SPY
    sector: ETF
  - ticker: QQQ
    sector: ETF
  - ticker: IWM
    sector: ETF
  - ticker: DIA
    sector: ETF
  - ticker: AAPL
    sector: Technology
  - ticker: MSFT
    sector: Technology
  - ticker: NVDA
    sector: Technology
  - ticker: AMZN
    sector: Consumer Discretionary
  - ticker: META
    sector: Technology
  - ticker: GOOGL
    sector: Technology
  - ticker: JPM
    sector: Financials
  - ticker: XOM
    sector: Energy

strategies:
  - CASH_SECURED_PUT
  - COVERED_CALL
  - PUT_CREDIT_SPREAD
strategies_env: OPTIONS_AGENT_UNIVERSE_FEASIBILITY_STRATEGIES

# PAPER_TRADING_V1.5.14 acceptance correction: conservative, sequential
# batching/headroom policy for --universe-feasibility's two Tradier-
# request phases (option-chain opportunity scan, then correlation/
# history). Every number here is a POLICY choice (same *_env-override
# convention every other config file in this repository establishes),
# never a Tradier plan assumption -- the study decides whether to
# proceed using ONLY the provider's own observed response-header state
# (src.data.rate_limiter.RateLimitState), never a hardcoded figure like
# "120/minute". See src.workflows.universe_feasibility
# .has_sufficient_observed_headroom and
# scripts/run_validation_cycle.py::run_universe_feasibility_study's own
# docstring for the exact bootstrap/stop-before-exhaustion mechanics.
rate_limit_safety:
  # How many symbols' worth of option-chain requests to attempt before
  # re-checking observed rate-limit headroom. Deliberately small and
  # sequential -- never aggressive concurrency. The FIRST batch always
  # proceeds (there is nothing observed yet to check against); from the
  # second batch onward, the study only continues if the provider's own
  # last-observed response headers show enough reserved headroom for
  # the next batch's worst-case logical request count.
  batch_size: 3
  batch_size_env: OPTIONS_AGENT_FEASIBILITY_BATCH_SIZE
  # Fraction of the provider's own reported TOTAL allowance
  # (RateLimitState.allowed, never a hardcoded number) reserved as a
  # safety margin for other concurrent consumers of the same real
  # Tradier-account-wide budget (the official cycle, a dashboard-
  # triggered run, a second --diagnostic-scan) that this process cannot
  # see or coordinate with, before the opportunity-scan phase may start
  # its next batch.
  reserved_headroom_pct: 0.20
  reserved_headroom_pct_env: OPTIONS_AGENT_FEASIBILITY_RESERVED_HEADROOM_PCT
  # Same idea, applied before the correlation phase begins at all (a
  # separate, larger reserve -- correlation is the lower-priority,
  # P5_BACKGROUND_RESEARCH phase, and is the first thing this study
  # gives up when headroom is tight).
  correlation_reserved_headroom_pct: 0.30
  correlation_reserved_headroom_pct_env: OPTIONS_AGENT_FEASIBILITY_CORRELATION_RESERVED_HEADROOM_PCT
