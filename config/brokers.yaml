# Per-broker execution capabilities the Risk Engine must consult before
# ever constructing an ApprovedOrder / FidelityTradeTicket. A broker
# missing from this file, or a strategy missing from its
# allowed_strategies list, is REJECT_ACCOUNT_CAPABILITY — the Risk
# Engine never infers a broker's options approval level or supported
# strategy set from anything else.
#
# execution_mode must be one of the modes src/brokers actually
# implements: MANUAL (a human enters the order, e.g. Fidelity) or
# AUTOMATED (a Broker implementation can place_order() directly, e.g.
# IBKR paper trading). There is no LIVE mode anywhere in this platform.
#
# Step 19A note: the 9 strategies below CALL_CREDIT_SPREAD onward are
# the Tier-1 expansion — every one of them fits src.llm.schemas
# .TradeProposal's existing <=2-leg cap and is fully wired through
# Python Quant / Python Risk Engine / PaperBroker / FidelityManualProvider,
# same as the original 3.
#
# Step 20A note: LONG_CALL_BUTTERFLY / SHORT_IRON_CONDOR /
# SHORT_IRON_BUTTERFLY were deliberately absent from every list below
# through Step 19A/14B/the 19A re-ask, since they were not yet
# representable as a TradeProposal at all (3-4 legs). Step 20A raised
# TradeProposal.legs to a 4-leg cap, added the matching StrategyType
# members, and wired all 3 strategies through structure validation,
# Python Quant (a per-leg quantity_ratio for LONG_CALL_BUTTERFLY's
# 1:-2:1 structure), Python Risk Engine, PaperBroker (ratio-aware
# fills/collateral), and FidelityManualProvider end-to-end — proven by
# tests/unit/risk/test_multileg_strategies.py and
# tests/unit/brokers/test_paper_broker_multileg.py before being added
# here, per this file's own standing rule (never list a capability
# before it's actually backed up).

fidelity:
  execution_mode: MANUAL
  account_alias: OPTIONS_ACCOUNT
  options_enabled: true
  allowed_strategies:
    - CASH_SECURED_PUT
    - COVERED_CALL
    - PUT_CREDIT_SPREAD
    - CALL_CREDIT_SPREAD
    - BULL_CALL_SPREAD
    - BEAR_PUT_SPREAD
    - PROTECTIVE_PUT
    - PROTECTIVE_COLLAR
    - LONG_STRADDLE
    - LONG_STRANGLE
    - LONG_CALL
    - LONG_PUT
    - LONG_CALL_BUTTERFLY
    - SHORT_IRON_CONDOR
    - SHORT_IRON_BUTTERFLY

ibkr_paper:
  execution_mode: AUTOMATED
  account_alias: IBKR_PAPER
  options_enabled: true
  allowed_strategies:
    - CASH_SECURED_PUT
    - COVERED_CALL
    - PUT_CREDIT_SPREAD
    - CALL_CREDIT_SPREAD
    - BULL_CALL_SPREAD
    - BEAR_PUT_SPREAD
    - PROTECTIVE_PUT
    - PROTECTIVE_COLLAR
    - LONG_STRADDLE
    - LONG_STRANGLE
    - LONG_CALL
    - LONG_PUT
    - LONG_CALL_BUTTERFLY
    - SHORT_IRON_CONDOR
    - SHORT_IRON_BUTTERFLY

# src.brokers.paper.PaperBroker — the internal simulator (Step 12), not
# a connection to any real brokerage, paper or otherwise.
internal_paper:
  execution_mode: AUTOMATED
  account_alias: INTERNAL_PAPER
  options_enabled: true
  allowed_strategies:
    - CASH_SECURED_PUT
    - COVERED_CALL
    - PUT_CREDIT_SPREAD
    - CALL_CREDIT_SPREAD
    - BULL_CALL_SPREAD
    - BEAR_PUT_SPREAD
    - PROTECTIVE_PUT
    - PROTECTIVE_COLLAR
    - LONG_STRADDLE
    - LONG_STRANGLE
    - LONG_CALL
    - LONG_PUT
    - LONG_CALL_BUTTERFLY
    - SHORT_IRON_CONDOR
    - SHORT_IRON_BUTTERFLY
